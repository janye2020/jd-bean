<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c8161d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="领京豆" />
  <title>领京豆入口</title>
  <style>
    :root {
      --bg: #f6f3ef;
      --bg-accent: #efe8e0;
      --surface: #fffdf9;
      --ink: #1a1410;
      --muted: #6b6158;
      --line: #e4ddd4;
      --brand: #c8161d;
      --brand-deep: #9e1016;
      --ok: #1f7a4c;
      --ok-bg: #e7f5ee;
      --shadow: 0 1px 0 rgba(26, 20, 16, 0.04);
      --radius: 12px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #f8d9d6 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f0e6d4 0%, transparent 50%),
        var(--bg);
      line-height: 1.35;
      -webkit-tap-highlight-color: transparent;
    }

    .wrap {
      width: min(560px, 100%);
      margin: 0 auto;
      padding: 12px 12px calc(20px + var(--safe-bottom));
    }

    header {
      padding: 4px 2px 10px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
    }

    .brand-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 0 3px rgba(200, 22, 29, 0.12);
    }

    h1 {
      margin: 6px 0 4px;
      font-size: clamp(22px, 5.5vw, 26px);
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 8px;
    }

    button, .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--ink);
      border-radius: 999px;
      padding: 6px 11px;
      font: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    button:active, .btn:active { transform: scale(0.97); }
    button.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }
    button.ghost:hover, .btn:hover { border-color: #cfc5ba; background: #fff; }

    .hint {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: 10px;
      background: var(--bg-accent);
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .hint strong { color: var(--ink); font-weight: 650; }

    .list {
      display: grid;
      gap: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--surface);
    }

    .lists {
      display: grid;
      gap: 0;
    }

    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      box-shadow: none;
      transition: opacity 0.2s ease, background 0.2s ease;
    }

    .item:last-child { border-bottom: 0; }

    .item.done {
      opacity: 0.5;
      background: #f7f3ee;
    }

    .check {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      border: 1.5px solid #c9bfb4;
      background: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .item.done .check {
      background: var(--ok);
      border-color: var(--ok);
      color: #fff;
    }

    .check svg { width: 10px; height: 10px; opacity: 0; }
    .item.done .check svg { opacity: 1; }

    .meta { min-width: 0; }
    .name {
      font-size: 13px;
      font-weight: 700;
      margin: 0;
      line-height: 1.25;
    }
    .desc {
      margin: 1px 0 0;
      font-size: 11px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tags {
      display: flex;
      gap: 4px;
      margin-top: 3px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 650;
      padding: 1px 5px;
      border-radius: 999px;
      background: #f1ebe3;
      color: #5d534b;
    }

    .tag.jd { background: #fde8e9; color: var(--brand-deep); }
    .tag.jr { background: #e8eefc; color: #2a4ea3; }
    .tag.custom { background: var(--ok-bg); color: var(--ok); }
    .tag.ok { background: var(--ok-bg); color: var(--ok); }
    .tag.path { background: #fff3df; color: #8a5a12; }
    .tag.warn { background: #f3efe9; color: #6b6158; }

    .group-title {
      margin: 12px 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .group-title:first-child { margin-top: 2px; }

    .actions {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 4px;
      max-width: 148px;
    }

    .actions button {
      min-width: 0;
      padding: 5px 8px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.2;
    }

    .actions .open-app {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .section-title {
      margin: 14px 0 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    .panel {
      padding: 10px;
      border-radius: var(--radius);
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .field {
      display: grid;
      gap: 4px;
      margin-bottom: 8px;
    }

    label {
      font-size: 12px;
      font-weight: 650;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      background: #fff;
      color: var(--ink);
    }

    input:focus, select:focus {
      outline: 2px solid rgba(200, 22, 29, 0.2);
      border-color: #e29a9d;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    footer {
      margin-top: 14px;
      color: var(--muted);
      font-size: 11px;
      text-align: center;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + var(--safe-bottom));
      transform: translateX(-50%) translateY(20px);
      background: rgba(26, 20, 16, 0.92);
      color: #fff;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 20;
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand"><span class="brand-dot"></span>京豆入口</div>
      <h1>每日领京豆</h1>
      <p class="lead">点「打开 App」跳进官方页面，在京东里手动领取。本页不代领、不收集账号。</p>
    </header>

    <div class="toolbar">
      <button type="button" class="primary" id="btnReset">重置今日勾选</button>
      <button type="button" class="ghost" id="btnExport">导出链接</button>
      <button type="button" class="ghost" id="btnImport">导入链接</button>
    </div>

    <p class="hint">
      <strong>说明：</strong>很多旧「频道签到」外链已被改成导购/秒杀页，能打开但看不到签到——属于活动改版，不是你的网络问题。
      稳妥做法：App 内搜「领京豆」，或打开活动后点分享，把链接加到下方「自定义」。
    </p>

    <div class="lists" id="list"></div>

    <div class="section-title">添加自定义入口</div>
    <form class="panel" id="addForm">
      <div class="field">
        <label for="name">名称</label>
        <input id="name" name="name" placeholder="例如：某馆每日签到" required maxlength="40" />
      </div>
      <div class="field">
        <label for="url">H5 链接</label>
        <input id="url" name="url" type="url" placeholder="https://..." required />
      </div>
      <div class="row">
        <div class="field">
          <label for="app">打开方式</label>
          <select id="app" name="app">
            <option value="jd">京东 App</option>
            <option value="jdjr">京东金融 App</option>
            <option value="web">仅浏览器</option>
          </select>
        </div>
        <div class="field">
          <label for="note">备注（可选）</label>
          <input id="note" name="note" placeholder="例如：每晚 8 点" maxlength="40" />
        </div>
      </div>
      <button type="submit" class="primary" style="width:100%;border-radius:12px;">添加入口</button>
    </form>

    <footer>
      京东常改版：能打开不等于还有签到。优先用「App 路径」或自定义分享链接。
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_CUSTOM = "jd-bean-custom-v1";
    const STORAGE_DONE = "jd-bean-done-v1";

    /**
     * status:
     *  - direct: 页面本身仍含签到/领豆相关内容（仍可能改版）
     *  - path:   无稳定外链，打开 App 后按备注路径操作
     *  - play:   养成/抽奖类，不一定是「每日签到」按钮
     */
    const GROUPS = [
      {
        title: "仍可能直达签到（外链实测）",
        items: [
          {
            id: "paipai",
            name: "拍拍二手签到",
            url: "https://pro.m.jd.com/mall/active/3S28janPLYmtFxypu37AYAGgivfp/index.html",
            app: "jd",
            status: "direct",
            note: "标题仍为「签到有礼」，页面内找签到按钮"
          },
          {
            id: "jr-sign",
            name: "金融每日签到",
            url: "https://member.jr.jd.com/activity/sign/v5/indexV2.html?id=7038",
            app: "jdjr",
            status: "direct",
            note: "建议用京东金融打开；需登录"
          },
          {
            id: "jr-coin",
            name: "金融金币翻翻翻",
            url: "https://m.jr.jd.com/member/coinlottery/index.html",
            app: "jdjr",
            status: "play",
            note: "金币活动，不是京豆签到"
          }
        ]
      },
      {
        title: "App 内路径（外链已失效/改版）",
        items: [
          {
            id: "path-bean",
            name: "领京豆 / 天天领豆",
            app: "jd",
            mode: "search",
            keyword: "领京豆",
            status: "path",
            note: "打开后搜索「领京豆」或「天天领豆」进入"
          },
          {
            id: "path-market",
            name: "京东超市签到",
            app: "jd",
            mode: "search",
            keyword: "京东超市",
            status: "path",
            note: "进超市页后看左上角「签」字入口"
          },
          {
            id: "path-seckill",
            name: "秒杀领京豆",
            app: "jd",
            mode: "search",
            keyword: "京东秒杀",
            status: "path",
            note: "进秒杀页后找「领京豆」入口"
          },
          {
            id: "path-flash",
            name: "品牌闪购签到",
            app: "jd",
            mode: "search",
            keyword: "品牌闪购",
            status: "path",
            note: "进闪购页向下找签到"
          },
          {
            id: "path-plant",
            name: "种豆得豆",
            app: "jd",
            mode: "search",
            keyword: "种豆得豆",
            status: "path",
            note: "或：首页 → 领京豆 → 种豆得豆（旧 H5 已下线）"
          },
          {
            id: "path-mine-bean",
            name: "我的 · 京豆签到",
            app: "jd",
            mode: "home",
            status: "path",
            note: "打开 App → 我的 → 京豆 / 去签到"
          },
          {
            id: "path-jr-home",
            name: "金融 App 签到入口",
            app: "jdjr",
            mode: "home",
            status: "path",
            note: "打开金融 App → 省钱 / 会员里找每日签到"
          }
        ]
      }
    ];

    const BUILTIN = GROUPS.flatMap((g) =>
      g.items.map((item) => ({ ...item, group: g.title }))
    );

    function todayKey() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function loadCustom() {
      try {
        const raw = localStorage.getItem(STORAGE_CUSTOM);
        const list = raw ? JSON.parse(raw) : [];
        return Array.isArray(list) ? list : [];
      } catch {
        return [];
      }
    }

    function saveCustom(list) {
      localStorage.setItem(STORAGE_CUSTOM, JSON.stringify(list));
    }

    function loadDone() {
      try {
        const raw = localStorage.getItem(STORAGE_DONE);
        const data = raw ? JSON.parse(raw) : null;
        if (!data || data.date !== todayKey()) return new Set();
        return new Set(Array.isArray(data.ids) ? data.ids : []);
      } catch {
        return new Set();
      }
    }

    function saveDone(set) {
      localStorage.setItem(
        STORAGE_DONE,
        JSON.stringify({ date: todayKey(), ids: [...set] })
      );
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    function buildJdScheme(params) {
      const encoded = encodeURIComponent(JSON.stringify(params));
      if (isAndroid()) {
        return (
          "intent://virtual?params=" +
          encoded +
          "#Intent;scheme=openapp.jdmobile;package=com.jingdong.app.mall;end"
        );
      }
      return "openapp.jdmobile://virtual?params=" + encoded;
    }

    function buildJdOpenApp(url) {
      return buildJdScheme({
        category: "jump",
        des: "m",
        url,
        sourceType: "JSHOP_SOURCE_TYPE",
        sourceValue: "JSHOP_SOURCE_VALUE",
        M_sourceFrom: "h5auto",
        msf_type: "auto"
      });
    }

    function buildJdSearch(keyword) {
      return buildJdScheme({
        category: "jump",
        des: "productList",
        keyWord: keyword,
        from: "search",
        sourceType: "search"
      });
    }

    function buildJdHome() {
      return buildJdScheme({
        category: "jump",
        des: "HomePage"
      });
    }

    function buildJrOpenApp(url) {
      return "openjdjrapp://com.jd.jrapp/webview?url=" + encodeURIComponent(url);
    }

    function buildJrHome() {
      return "openjdjrapp://com.jd.jrapp/main";
    }

    function isAndroid() {
      return /Android/i.test(navigator.userAgent);
    }

    function resolveTarget(item) {
      if (item.mode === "search" && item.keyword) {
        return {
          scheme: item.app === "jdjr" ? buildJrHome() : buildJdSearch(item.keyword),
          fallback: null,
          toastMsg: "已打开 App，请按备注在搜索结果里进入"
        };
      }
      if (item.mode === "home") {
        return {
          scheme: item.app === "jdjr" ? buildJrHome() : buildJdHome(),
          fallback: null,
          toastMsg: "已打开 App，请按备注路径操作"
        };
      }

      const url = item.url;
      if (!url) {
        return { scheme: null, fallback: null, toastMsg: "缺少链接" };
      }
      if (item.app === "web") {
        return { scheme: null, fallback: url, toastMsg: "已打开页面" };
      }
      if (item.app === "jdjr") {
        return {
          scheme: buildJrOpenApp(url),
          fallback: url,
          toastMsg: "已尝试打开，请在 App 内领取"
        };
      }
      return {
        scheme: buildJdOpenApp(url),
        fallback: url,
        toastMsg: "已尝试打开，请在 App 内领取"
      };
    }

    function openLink(item) {
      const target = resolveTarget(item);
      if (target.scheme) {
        const start = Date.now();
        location.href = target.scheme;
        if (target.fallback) {
          setTimeout(() => {
            if (document.hidden) return;
            if (Date.now() - start < 2200) location.href = target.fallback;
          }, 1200);
        }
        return target.toastMsg;
      }
      if (target.fallback) {
        location.href = target.fallback;
        return target.toastMsg;
      }
      return target.toastMsg || "无法打开";
    }

    function statusTag(item) {
      if (item.custom) return '<span class="tag custom">自定义</span>';
      if (item.status === "direct") return '<span class="tag ok">直达签到</span>';
      if (item.status === "path") return '<span class="tag path">App 路径</span>';
      if (item.status === "play") return '<span class="tag warn">养成/抽奖</span>';
      return "";
    }

    function renderItem(item, done, list) {
      const isDone = done.has(item.id);
      const el = document.createElement("article");
      el.className = "item" + (isDone ? " done" : "");
      el.dataset.id = item.id;

      const appTag =
        item.app === "jdjr" ? "金融" : item.app === "web" ? "浏览器" : "京东";
      const appClass =
        item.app === "jdjr" ? "jr" : item.app === "web" ? "" : "jd";
      const hasWeb = Boolean(item.url) && item.mode !== "search" && item.mode !== "home";

      el.innerHTML = `
        <button type="button" class="check" aria-label="标记已领" title="标记今日已领">
          <svg viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M2.5 6.2L4.8 8.5L9.5 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="meta">
          <p class="name"></p>
          <p class="desc"></p>
          <div class="tags">
            <span class="tag ${appClass}">${appTag}</span>
            ${statusTag(item)}
          </div>
        </div>
        <div class="actions">
          <button type="button" class="open-app">打开 App</button>
          ${hasWeb ? '<button type="button" class="open-web">H5</button>' : ""}
          ${item.custom ? '<button type="button" class="del">删除</button>' : ""}
        </div>
      `;

      el.querySelector(".name").textContent = item.name;
      el.querySelector(".desc").textContent = item.note || item.url || "";

      el.querySelector(".check").addEventListener("click", () => {
        const set = loadDone();
        if (set.has(item.id)) set.delete(item.id);
        else set.add(item.id);
        saveDone(set);
        render();
      });

      el.querySelector(".open-app").addEventListener("click", () => {
        const msg = openLink(item);
        const set = loadDone();
        set.add(item.id);
        saveDone(set);
        render();
        toast(msg);
      });

      const webBtn = el.querySelector(".open-web");
      if (webBtn) {
        webBtn.addEventListener("click", () => {
          window.open(item.url, "_blank", "noopener,noreferrer");
        });
      }

      const del = el.querySelector(".del");
      if (del) {
        del.addEventListener("click", () => {
          const next = loadCustom().filter((x) => x.id !== item.id);
          saveCustom(next);
          const set = loadDone();
          set.delete(item.id);
          saveDone(set);
          render();
          toast("已删除自定义入口");
        });
      }

      list.appendChild(el);
    }

    function renderGroup(title, items, done, root) {
      const h = document.createElement("div");
      h.className = "group-title";
      h.textContent = title;
      root.appendChild(h);

      const box = document.createElement("div");
      box.className = "list";
      root.appendChild(box);
      items.forEach((item) => renderItem(item, done, box));
    }

    function render() {
      const done = loadDone();
      const root = document.getElementById("list");
      root.innerHTML = "";

      const custom = loadCustom().map((x) => ({
        ...x,
        custom: true,
        status: "direct",
        group: "我的自定义"
      }));

      if (custom.length) {
        renderGroup("我的自定义", custom, done, root);
      }

      GROUPS.forEach((group) => {
        renderGroup(group.title, group.items, done, root);
      });
    }

    document.getElementById("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const form = e.target;
      const name = form.name.value.trim();
      const url = form.url.value.trim();
      const app = form.app.value;
      const note = form.note.value.trim();
      if (!/^https?:\/\//i.test(url)) {
        toast("请填写以 http(s) 开头的链接");
        return;
      }
      const list = loadCustom();
      list.unshift({
        id: "c-" + Date.now().toString(36),
        name,
        url,
        app,
        note
      });
      saveCustom(list);
      form.reset();
      render();
      toast("已添加");
    });

    document.getElementById("btnReset").addEventListener("click", () => {
      saveDone(new Set());
      render();
      toast("今日勾选已清空");
    });

    document.getElementById("btnExport").addEventListener("click", async () => {
      const payload = JSON.stringify(loadCustom(), null, 2);
      try {
        await navigator.clipboard.writeText(payload);
        toast("自定义链接已复制到剪贴板");
      } catch {
        prompt("复制以下 JSON：", payload);
      }
    });

    document.getElementById("btnImport").addEventListener("click", () => {
      const raw = prompt("粘贴自定义入口 JSON 数组：");
      if (raw == null || !raw.trim()) return;
      try {
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) throw new Error("not array");
        const cleaned = data
          .filter((x) => x && x.name && x.url)
          .map((x) => ({
            id: x.id || "c-" + Math.random().toString(36).slice(2, 9),
            name: String(x.name).slice(0, 40),
            url: String(x.url),
            app: ["jd", "jdjr", "web"].includes(x.app) ? x.app : "jd",
            note: x.note ? String(x.note).slice(0, 40) : ""
          }));
        saveCustom(cleaned);
        render();
        toast(`已导入 ${cleaned.length} 条`);
      } catch {
        toast("导入失败，请检查 JSON 格式");
      }
    });

    render();
  </script>
</body>
</html>
